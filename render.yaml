# Render Blueprint — must live at the repository ROOT (Render only reads render.yaml
# from the repo root). It builds the RPA Doc Generator app from the subfolder.
#
# Deploy: Render dashboard → New + → Blueprint → select this repo + branch.
services:
  - type: web
    name: rpa-doc-generator
    runtime: python
    rootDir: rpa_doc_generator
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 180 app:app
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      # Optional: set your key in the Render dashboard to enable Claude analysis.
      - key: ANTHROPIC_API_KEY
        sync: false
